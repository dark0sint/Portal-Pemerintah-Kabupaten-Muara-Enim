# /etc/nginx/sites-available/portal-muaraenim  (ganti muaraenimkab.go.id dengan domain resmi Anda)
limit_req_zone $binary_remote_addr zone=portal:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name muaraenimkab.go.id www.muaraenimkab.go.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://muaraenimkab.go.id$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name muaraenimkab.go.id www.muaraenimkab.go.id;

    ssl_certificate     /etc/letsencrypt/live/muaraenimkab.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muaraenimkab.go.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 6m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location /static/ {
        alias /srv/portal-muaraenim/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location ~ ^/(pengaduan|layanan|lacak|admin/login|admin/2fa|api/chat) {
        limit_req zone=forms burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=portal burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
}
